<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Administrare Centrul Medical</title>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        var hash = window.location.hash || "";
        var hasInvite = hash.indexOf("invite_token=") !== -1;
        var hasRecovery = hash.indexOf("recovery_token=") !== -1;
        var hasConfirmation = hash.indexOf("confirmation_token=") !== -1;
        window.netlifyIdentity.on("init", function (user) {
          if (hasInvite) {
            window.netlifyIdentity.open("signup");
          } else if (hasRecovery || hasConfirmation) {
            window.netlifyIdentity.open();
          }
          if (!user) {
            window.netlifyIdentity.on("login", function () {
              document.location.href = "/admin/";
            });
          }
        });
        window.netlifyIdentity.init();
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
