# Hero
hero:
  headline: Bine ați venit!
  subtitle: Îngrijire medicală de încredere, aproape de tine.
  heroImage: assets/img/hero-bg.jpg
  whyTitle: De ce să ne alegeți?
  whyBody: |
    Echipa noastră este formată din cadre medicale cu experiență, dedicate îngrijirii corecte și
    responsabile a fiecărui pacient, indiferent de vârstă.
    Oferim servicii medicale adaptate nevoilor copiilor, părinților și vârstnicilor, într-un singur loc,
    într-un mediu sigur și prietenos.
    Punem accent pe o relație calmă și empatică cu cei mici, pentru ca fiecare consultație să fie o
    experiență cât mai confortabilă.
    Credem într-o relație bazată pe încredere, transparență și comunicare clară între medic și pacient.
  learnMoreLabel: Learn More
  iconBoxes:
    - icon: bi bi-clipboard-data
      title: Medicină de familie la standarde înalte
      text: Servicii medicale moderne pentru întreaga familie, cu grijă reală pentru sănătatea și siguranța fiecărui pacient.
    - icon: bi bi-gem
      title: Îngrijire medicală atentă pentru copii și părinți
      text: Punem accent pe prevenție, diagnostic corect și tratament personalizat, într-o atmosferă calmă și prietenoasă
    - icon: bi bi-inboxes
      title: Excelență în îngrijirea medicală pentru întreaga familie
      text: Oferim servicii medicale complete pentru copii și adulți, într-un mediu sigur, modern și bazat pe respect față de pacient.

# About
about:
  title: Despre noi
  intro: |
    Centrul medical Dr. Cojocariu oferă servicii medicale de înaltă calitate în domeniul medicinei de familie,
    adresându-se atât copiilor, cât și adulților.
  image: assets/img/gallery/centru_medical_exterior.jpg
  items:
    - icon: fa-solid fa-vial-circle-check
      title: Sănătatea voastră, prioritatea noastră
      text: Punem pacientul pe primul loc și oferim îngrijire medicală atentă, adaptată nevoilor fiecăruia.
    - icon: fa-solid fa-pump-medical
      title: Servicii medicale decontate prin Casa de Sănătate
      text: Asigurăm acces la consultații și investigații medicale decontate, în baza biletului de trimitere.
    - icon: fa-solid fa-heart-circle-xmark
      title: O echipă medicală în care poți avea încredere
      text: Medicii noștri sunt profesioniști cu experiență, dedicați actului medical și relației cu pacientul.

