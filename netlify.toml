# Netlify build configuration for Centrul Medical
# Build fetches content from Sanity and merges into the HTML template.

[build]
  command = "npm install && node build.js"
  publish = "."
  environment = { NODE_VERSION = "18" }

# Sanity environment variables — set these in Netlify UI under Site Settings > Environment Variables:
# SANITY_PROJECT_ID = your-project-id
# SANITY_DATASET    = production
# SANITY_TOKEN      = sanity read token (required for private datasets). Add it for Production, Branch deploys, and Deploy previews.
